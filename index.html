<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Saldos Sugey"/>
<meta name="theme-color" content="#0a0f1e"/>
<link rel="manifest" href="data:application/json,{%22name%22:%22Saldos%20Sugey%22,%22short_name%22:%22Sugey%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0f1e%22,%22theme_color%22:%22%230a0f1e%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/869/869869.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}"/>
<title>Saldos Sugey</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0f1e;--surface:#111827;--border:#1e2d45;--text:#f1f5f9;--muted:#64748b;--dim:#334155;--blue:#3b82f6;--green:#22c55e;--cyan:#06b6d4;--yellow:#f59e0b;--red:#ef4444;--purple:#a855f7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:500px;margin:0 auto}
h1,h2{font-family:'Syne',sans-serif}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:200}
.login-logo{font-size:60px;margin-bottom:16px}
.login-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--text);text-align:center;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:40px}
.google-btn{display:flex;align-items:center;gap:12px;background:#fff;color:#1a1a1a;border:none;border-radius:14px;padding:14px 24px;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:300px;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.google-btn:active{opacity:.85}
.google-btn img{width:22px;height:22px}

/* WAITING APPROVAL */
#waiting-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:200;text-align:center}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100}
#loader .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* APP */
#app{display:flex;flex-direction:column;min-height:100vh;display:none}
#header{background:linear-gradient(135deg,#0d1f3c,#0a0f1e);padding:13px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
#header-left h1{font-size:16px;letter-spacing:-0.5px;color:var(--text)}
#header-left p{font-size:10px;color:#60a5fa;margin-top:1px}
#header-right{display:flex;align-items:center;gap:8px}
.user-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}
.badge-admin{background:#7c3aed;color:#e9d5ff}
.badge-emp{background:#1d4ed8;color:#bfdbfe}
.logout-btn{background:none;border:1px solid var(--dim);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}

#content{flex:1;overflow-y:auto;padding:14px 14px 90px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:20}
.nav-btn{flex:1;border:none;background:none;cursor:pointer;padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn span{font-size:18px}
.nav-btn label{font-size:9px;font-weight:700;letter-spacing:0.4px;color:var(--muted);cursor:pointer;text-transform:uppercase}
.nav-btn.active label{color:var(--cyan)}
.nav-dot{width:16px;height:2px;background:var(--cyan);border-radius:2px}

/* CARDS / FORMS */
.card{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--text);margin-bottom:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--dim);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-gray{background:var(--dim);color:var(--text)}
.btn-purple{background:#7c3aed;color:#fff}
.btn-red{background:#dc2626;color:#fff}

/* BADGES */
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.badge-1{background:#1d4ed8;color:#bfdbfe}
.badge-2{background:#166534;color:#bbf7d0}

/* TOAST */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--dim);color:var(--text);padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.hidden{opacity:0}

/* ITEMS */
.item{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:7px;overflow:hidden}
.item-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;gap:8px}
.item-info{flex:1;min-width:0}
.item-name{font-weight:700;font-size:14px;color:var(--text)}
.item-sub{font-size:11px;color:var(--muted);margin-top:2px}
.item-meta{font-size:10px;color:var(--dim);margin-top:2px}
.item-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.price-cyan{font-weight:800;font-size:15px;color:var(--cyan)}
.price-green{font-weight:800;font-size:15px;color:var(--green)}
.price-purple{font-weight:800;font-size:15px;color:#c084fc}
.del-btn{background:#7f1d1d;color:#fca5a5;border:none;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;min-width:36px;min-height:34px;touch-action:manipulation}
.ok-btn{background:#14532d;color:#86efac;border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;min-height:34px;touch-action:manipulation}
.confirm-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;gap:8px;background:#1c1208}
.confirm-row span{color:var(--yellow);font-size:13px;font-weight:600;flex:1}
.confirm-btns{display:flex;gap:8px;flex-shrink:0}
.confirm-btns button{border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.btn-no{background:var(--dim);color:#94a3b8}
.btn-yes{background:#dc2626;color:#fff}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{border-radius:12px;padding:13px 14px;text-align:center}
.s-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px}
.s-val{font-family:'Syne',sans-serif;font-weight:800;font-size:19px}
.grand-total{background:linear-gradient(135deg,#0284c7,#0c4a6e);border-radius:14px;padding:18px 20px;text-align:center;margin-bottom:12px}
.g-label{font-size:10px;font-weight:700;color:#bae6fd;text-transform:uppercase;letter-spacing:1px}
.g-val{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#fff;margin-top:4px}

/* FILTER BOX */
.filter-box{background:var(--bg);border:1px solid var(--dim);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.filter-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px}
.date-input,.select-input,.search-input{background:var(--bg);border:1px solid var(--dim);border-radius:9px;padding:8px 10px;color:var(--text);font-size:12px;width:100%;outline:none;font-family:'DM Sans',sans-serif;appearance:none;-webkit-appearance:none}

/* APARTADOS */
.status-pendiente{background:#422006;color:#fb923c;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700}
.status-entregado{background:#14532d;color:#86efac;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700}

/* TOTALS */
.totals-row{display:flex;justify-content:space-between;padding:10px 0 0;border-top:1px solid var(--border);margin-top:4px;font-weight:700;font-size:14px;color:var(--muted)}
.cli-header{width:100%;background:none;border:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.cli-body{background:var(--bg);border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.cli-total{display:flex;justify-content:space-between;padding-top:7px;border-top:1px solid var(--border)}

/* USERS TABLE */
.user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.user-row:last-child{border-bottom:none}
.online-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);margin-bottom:6px;margin-top:4px}
select option{background:#111827}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader"><div class="spin"></div><p style="color:#64748b;font-size:13px">Cargando...</p></div>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="login-logo">🛍️</div>
  <div class="login-title">Saldos Sugey</div>
  <p class="login-sub">Inicia sesión para continuar</p>
  <button class="google-btn" onclick="loginGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"/>
    Continuar con Google
  </button>
  <p id="login-error" style="color:#ef4444;font-size:12px;margin-top:16px;text-align:center"></p>
</div>

<!-- WAITING -->
<div id="waiting-screen" style="display:none">
  <div style="font-size:50px;margin-bottom:16px">⏳</div>
  <h2 style="font-family:Syne,sans-serif;font-size:20px;margin-bottom:8px">Acceso pendiente</h2>
  <p style="color:var(--muted);font-size:13px;max-width:280px">Tu cuenta fue registrada. Pide al <strong style="color:var(--text)">administrador</strong> que te asigne un rol para entrar.</p>
  <button onclick="signOut()" style="margin-top:24px;background:none;border:1px solid var(--dim);color:var(--muted);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer">Cerrar sesión</button>
</div>

<!-- TOAST -->
<div id="toast" class="hidden"></div>

<!-- APP -->
<div id="app">
  <div id="header">
    <div id="header-left">
      <h1>🛍️ Saldos Sugey</h1>
      <p id="header-sub">Conectando...</p>
    </div>
    <div id="header-right">
      <span id="role-badge" class="user-badge"></span>
      <button class="logout-btn" onclick="signOut()">Salir</button>
    </div>
  </div>
  <div id="content"></div>
  <div id="nav"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ── Firebase init ─────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyAtPo1O8qf7mhfzya_1BIoTxb4gt_u_qIQ",
  authDomain:"saldossugey.firebaseapp.com",
  projectId:"saldossugey",
  storageBucket:"saldossugey.firebasestorage.app",
  messagingSenderId:"481653374465",
  appId:"1:481653374465:web:68d5be7a04d8e663f58a00"
});
const db   = firebase.firestore();
const auth = firebase.auth();

// ── State ─────────────────────────────────────────────────────────────────
let currentUser = null;
let currentRol  = null; // 'admin' | 'empleado'
let pedidos=[], ventas=[], apartados=[], usuarios=[];
let cfg = {nombres:{"1":"Local 1","2":"Local 2"},emp:{"1":["Empleado 1-A","Empleado 1-B"],"2":["Empleado 2-A","Empleado 2-B"]}};
let currentTab = "pedidos";
let pendDelPed=null, pendDelVen=null, pendDelApt=null, openCliente=null;

let pedFil={inicio:weekStart(todayStr()),fin:todayStr(),local:"todos",search:""};
let venFil={fecha:todayStr()};
let aptFil={inicio:weekStart(todayStr()),fin:todayStr(),local:"todos",status:"todos",search:""};
let resFil={inicio:weekStart(todayStr()),fin:todayStr()};

let pedForm={local:"1",emp:"",fecha:todayStr(),cliente:"",desc:"",precio:""};
let abonoForm={}; // {aptId: amount}
let openAbono=null; // which apt is showing abono input
let editandoPedido=null; // {id, cliente, desc, precio, local, emp, fecha}
let venForm={local:"1",emp:"",fecha:todayStr(),monto:"",nota:""};
let aptForm={local:"1",emp:"",fecha:todayStr(),cliente:"",desc:"",total:"",anticipo:"",entregarFecha:""};
let ajForm=null;

let firestoreListeners=[];

// ── Helpers ───────────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().split("T")[0]}
function normalize(s){return(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()}
function weekStart(d){const dt=new Date(d+"T12:00:00"),day=dt.getDay(),diff=day===0?-6:1-day,m=new Date(dt);m.setDate(dt.getDate()+diff);return m.toISOString().split("T")[0]}
function fmtDate(s){if(!s)return"";const[,m,d]=s.split("-");const dias=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];return`${dias[new Date(s+"T12:00:00").getDay()]} ${d}/${m}`}
function fmtMoney(n){return"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})}
function badge(l){return`<span class="badge badge-${l}">${cfg.nombres[l]||"Local "+l}</span>`}
let _tt;
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.remove("hidden");clearTimeout(_tt);_tt=setTimeout(()=>e.classList.add("hidden"),2500)}
function show(id){document.getElementById(id).style.display="flex"}
function hide(id){document.getElementById(id).style.display="none"}

// ── Auth ──────────────────────────────────────────────────────────────────
async function loginGoogle(){
  try{
    document.getElementById("login-error").textContent="";
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    await auth.signInWithPopup(provider);
  }catch(e){
    if(e.code==="auth/popup-blocked"){
      // fallback to redirect
      const provider=new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    } else {
      document.getElementById("login-error").textContent="Error: "+e.message;
    }
  }
}

function signOut(){
  firestoreListeners.forEach(u=>u());
  firestoreListeners=[];
  auth.signOut();
}

// Handle redirect result
auth.getRedirectResult().then(result=>{
  if(result && result.user) console.log("Redirect login OK");
}).catch(e=>{
  console.error("Redirect error:",e);
});

auth.onAuthStateChanged(async user=>{
  try{
    hide("loader"); hide("login-screen"); hide("waiting-screen");
    document.getElementById("app").style.display="none";
    if(!user){show("login-screen");return}
    show("loader");
    currentUser=user;
    const userRef=db.collection("usuarios").doc(user.uid);
    const snap=await userRef.get();
    if(!snap.exists){
      const allUsers=await db.collection("usuarios").get();
      const rol=allUsers.empty?"admin":"sin-rol";
      await userRef.set({email:user.email,nombre:user.displayName||user.email,foto:user.photoURL||"",rol,creado:Date.now()});
      currentRol=rol;
    } else {
      currentRol=snap.data().rol;
    }
    hide("loader");
    if(currentRol==="sin-rol"){show("waiting-screen");return}
    document.getElementById("app").style.display="flex";
    document.getElementById("role-badge").textContent=currentRol==="admin"?"👑 Admin":"👤 Empleado";
    document.getElementById("role-badge").className="user-badge "+(currentRol==="admin"?"badge-admin":"badge-emp");
    initFirestoreListeners();
  }catch(err){
    hide("loader");
    show("login-screen");
    document.getElementById("login-error").textContent="Error: "+err.message;
    console.error("Auth error:",err);
  }
});

// ── Firestore listeners ───────────────────────────────────────────────────
function initFirestoreListeners(){
  let loaded=0;
  const total= currentRol==="admin"?5:4;
  function onLoad(){loaded++;if(loaded>=total){updateHeader();buildNav();render()}}

  firestoreListeners.push(
    db.collection("pedidos").orderBy("fecha","desc").onSnapshot(s=>{pedidos=s.docs.map(d=>({id:d.id,...d.data()}));if(loaded<total)onLoad();else render()}),
    db.collection("ventas").orderBy("fecha","desc").onSnapshot(s=>{ventas=s.docs.map(d=>({id:d.id,...d.data()}));if(loaded<total)onLoad();else render()}),
    db.collection("apartados").orderBy("fecha","desc").onSnapshot(s=>{apartados=s.docs.map(d=>({id:d.id,...d.data()}));if(loaded<total)onLoad();else render()}),
    db.collection("config").doc("main").onSnapshot(s=>{if(s.exists)cfg=s.data();if(loaded<total)onLoad();else{updateHeader();render()}})
  );

  if(currentRol==="admin"){
    firestoreListeners.push(
      db.collection("usuarios").onSnapshot(s=>{usuarios=s.docs.map(d=>({id:d.id,...d.data()}));if(loaded<total)onLoad();else render()})
    );
  } else {
    onLoad(); // skip usuarios listener for empleados
  }
}

function updateHeader(){
  document.getElementById("header-sub").innerHTML=`<span class="online-dot"></span>${cfg.nombres["1"]} · ${cfg.nombres["2"]} · En línea`;
}

// ── Nav (dinámico según rol) ───────────────────────────────────────────────
function buildNav(){
  const tabs=currentRol==="admin"
    ? [{id:"pedidos",icon:"📦",label:"Pedidos"},{id:"apartados",icon:"🏷️",label:"Apartados"},{id:"ventas",icon:"🏪",label:"Ventas"},{id:"resumen",icon:"📊",label:"Resumen"},{id:"ajustes",icon:"⚙️",label:"Ajustes"}]
    : [{id:"pedidos",icon:"📦",label:"Pedidos"},{id:"apartados",icon:"🏷️",label:"Apartados"},{id:"ventas",icon:"🏪",label:"Ventas"}];
  document.getElementById("nav").innerHTML=tabs.map(t=>`
    <button class="nav-btn${t.id===currentTab?" active":""}" id="nav-${t.id}" onclick="switchTab('${t.id}')">
      <span>${t.icon}</span><label>${t.label}</label>
      <div class="nav-dot" ${t.id!==currentTab?'style="display:none"':''} id="dot-${t.id}"></div>
    </button>`).join("");
}

function switchTab(t){
  // Protect admin-only tabs
  if((t==="resumen"||t==="ajustes")&&currentRol!=="admin"){toast("⛔ Solo el administrador puede ver esto");return}
  currentTab=t;pendDelPed=null;pendDelVen=null;pendDelApt=null;
  buildNav();render();
}

function render(){
  const el=document.getElementById("content");
  if(currentTab==="pedidos")        el.innerHTML=renderPedidos();
  else if(currentTab==="apartados") el.innerHTML=renderApartados();
  else if(currentTab==="ventas")    el.innerHTML=renderVentas();
  else if(currentTab==="resumen"&&currentRol==="admin")  el.innerHTML=renderResumen();
  else if(currentTab==="ajustes"&&currentRol==="admin")  el.innerHTML=renderAjustes();
  attachHandlers();
}

// ── FILTER BOX ────────────────────────────────────────────────────────────
function filterBox(idIni,idFin,fil,extra=""){
  return`<div class="filter-box">
    <div class="filter-title">🔍 Filtros de búsqueda</div>
    <div class="row2" style="margin-bottom:8px">
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700">DESDE</div><input type="date" onclick="try{this.showPicker()}catch(e){}" id="${idIni}" value="${fil.inicio}" class="date-input"/></div>
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700">HASTA</div><input type="date" onclick="try{this.showPicker()}catch(e){}" id="${idFin}" value="${fil.fin}" class="date-input"/></div>
    </div>
    ${extra}
  </div>`;
}

// ── PEDIDOS ───────────────────────────────────────────────────────────────
function renderPedidos(){
  const list=pedidos.filter(p=>p.fecha>=pedFil.inicio&&p.fecha<=pedFil.fin)
    .filter(p=>pedFil.local==="todos"||p.local===pedFil.local)
    .filter(p=>!pedFil.search||normalize(p.cliente).includes(normalize(pedFil.search)));
  const total=list.reduce((s,p)=>s+p.precio,0);
  const empList=cfg.emp[pedForm.local]||[];

  // Group by client for empleados
  const cmap={};
  list.forEach(p=>{

    </div>

      <option value="">— Selecciona —</option>
      ${empList.map(e=>`<option value="${e}" ${pedForm.emp===e?"selected":""}>${e}</option>`).join("")}

    <div class="field"><label>Cliente</label><input type="text" id="pf-cliente" placeholder="Ej: María García" value="${pedForm.cliente}"/></div>
    <div class="field"><label>Producto</label><input type="text" id="pf-desc" placeholder="Ej: 3 playeras azul talla M" value="${pedForm.desc}"/></div>
    <div class="field"><label>Precio $</label><input type="number" id="pf-precio" placeholder="0.00" value="${pedForm.precio}" inputmode="decimal"/></div>
    <button class="btn btn-blue" onclick="guardarPedido()">Guardar Pedido</button>
  </div>

    <select id="pf-floc" class="select-input" style="margin-bottom:8px">
      <option value="todos">Todos los locales</option>
      <option value="1" ${pedFil.local==="1"?"selected":""}>${cfg.nombres["1"]}</option>
      <option value="2" ${pedFil.local==="2"?"selected":""}>${cfg.nombres["2"]}</option>

    <input type="text" id="pf-search" placeholder="🔍 Buscar cliente..." value="${pedFil.search}" class="search-input"/>`)}
  <div class="card">
    <div class="card-title">📋 Resultados (${list.length} pedidos · ${clientesOrden.length} clientes)</div>
    ${list.length===0?'<p class="empty">Sin pedidos en este rango</p>':
      currentRol==="admin"
        ? list.map(p=>renderPedItem(p)).join("")+
          (list.length>0?`<div class="totals-row"><span>Total (${list.length})</span><span style="color:var(--cyan)">${fmtMoney(total)}</span></div>`:"")

}

function editarPedido(id){
  const p=pedidos.find(x=>x.id===id);
  if(!p)return;
  editandoPedido={...p};
  render();
  setTimeout(()=>{
    const el=document.getElementById("edit-modal");
    if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
  },100);
}

async function guardarEdicion(){
  if(!editandoPedido)return;
  // Try both id prefixes (ed- for empleados view, edit- for admin view)
  const getVal = (id1,id2) => {
    const el = document.getElementById(id1)||document.getElementById(id2);
    return el ? el.value : "";
  };
  const cliente = getVal("ed-cliente","edit-cliente").trim();
  const desc    = getVal("ed-desc","edit-desc").trim();
  const precio  = parseFloat(getVal("ed-precio","edit-precio"));
  const fecha   = getVal("ed-fecha","edit-fecha");
  const local   = getVal("ed-local","edit-local");
  const emp     = getVal("ed-emp","edit-emp");
  if(!cliente||!desc||!precio){toast("⚠️ Completa todos los campos");return}
  try{
    await db.collection("pedidos").doc(editandoPedido.id).update({cliente,desc,precio,fecha,local,emp});
    editandoPedido=null;
    toast("✅ Pedido actualizado");
  }catch(e){
    toast("❌ Error: "+e.message);
    console.error(e);
  }
}

async function guardarPedido(){
  const cliente=document.getElementById("pf-cliente").value.trim();
  const desc=document.getElementById("pf-desc").value.trim();
  const precio=parseFloat(document.getElementById("pf-precio").value);
  const fecha=document.getElementById("pf-fecha").value;
  const local=document.getElementById("pf-local").value;
  const emp=document.getElementById("pf-emp").value;
  if(!cliente||!desc||!precio){toast("⚠️ Completa cliente, producto y precio");return}
  pedForm={local,emp,fecha,cliente:"",desc:"",precio:""};
  await db.collection("pedidos").add({fecha,local,emp,cliente,desc,precio,ts:Date.now(),by:currentUser.email});
  toast("✅ Pedido guardado");
}
async function eliminarPedido(id){await db.collection("pedidos").doc(id).delete();pendDelPed=null;toast("🗑️ Eliminado")}

function renderAptItem(a){
  const abonos=a.abonos||[];
  const totalAbonado=(a.anticipo||0)+abonos.reduce((s,x)=>s+(x.monto||0),0);
  const restante=a.total-totalAbonado;

async function guardarApartado(){
  const cliente=document.getElementById("af-cliente").value.trim();
  const desc=document.getElementById("af-desc").value.trim();
  const total=parseFloat(document.getElementById("af-total").value)||0;
  const anticipo=parseFloat(document.getElementById("af-anticipo").value)||0;
  const fecha=document.getElementById("af-fecha").value;
  const local=document.getElementById("af-local").value;
  const emp=document.getElementById("af-emp").value;
  const entregarFecha=document.getElementById("af-entregar").value||"";
  if(!cliente||!desc||!total){toast("⚠️ Completa cliente, producto y total");return}
  aptForm={local,emp,fecha,cliente:"",desc:"",total:"",anticipo:"",entregarFecha:""};
  await db.collection("apartados").add({fecha,local,emp,cliente,desc,total,anticipo,entregarFecha,status:"pendiente",ts:Date.now(),by:currentUser.email});
  toast("✅ Apartado guardado");
}
async function eliminarApartado(id){await db.collection("apartados").doc(id).delete();pendDelApt=null;toast("🗑️ Eliminado")}
async function marcarEntregado(id){await db.collection("apartados").doc(id).update({status:"entregado"});toast("✅ Entregado")}

async function agregarAbono(id){
  const montoEl=document.getElementById("abono-monto-"+id);
  const fechaEl=document.getElementById("abono-fecha-"+id);
  const monto=parseFloat(montoEl?montoEl.value:0);
  const fecha=fechaEl?fechaEl.value:todayStr();
  if(!monto||monto<=0){toast("⚠️ Ingresa un monto válido");return}
  const snap=await db.collection("apartados").doc(id).get();
  const abonos=snap.data().abonos||[];
  abonos.push({monto,fecha,ts:Date.now(),by:currentUser.email});
  await db.collection("apartados").doc(id).update({abonos});
  openAbono=null;
  toast("✅ Abono registrado");
}

// ── Event handlers ────────────────────────────────────────────────────────
function attachHandlers(){
  const b=(id,fn)=>{const el=document.getElementById(id);if(el)fn(el)};
  b("pf-local",el=>el.onchange=e=>{pedForm.local=e.target.value;render()});
  b("pf-fecha",el=>el.onchange=e=>pedForm.fecha=e.target.value);
  b("pf-ini",el=>el.onchange=e=>{pedFil.inicio=e.target.value;render()});
  b("pf-fin",el=>el.onchange=e=>{pedFil.fin=e.target.value;render()});
  b("pf-floc",el=>el.onchange=e=>{pedFil.local=e.target.value;render()});
  b("pf-search",el=>{
    el.oninput=e=>{
      pedFil.search=e.target.value;
      clearTimeout(el._t);
      el._t=setTimeout(()=>{const v=document.getElementById("pf-search");const pos=v?v.selectionStart:-1;render();const nv=document.getElementById("pf-search");if(nv&&pos>=0){nv.focus();try{nv.setSelectionRange(pos,pos);}catch(e){}}},400);
    };
  });
  b("af-local",el=>el.onchange=e=>{aptForm.local=e.target.value;render()});
  b("af-ini",el=>el.onchange=e=>{aptFil.inicio=e.target.value;render()});
  b("af-fin",el=>el.onchange=e=>{aptFil.fin=e.target.value;render()});
  b("af-floc",el=>el.onchange=e=>{aptFil.local=e.target.value;render()});
  b("af-fstatus",el=>el.onchange=e=>{aptFil.status=e.target.value;render()});
  b("af-search",el=>{
    el.oninput=e=>{
      aptFil.search=e.target.value;
      clearTimeout(el._t);
      el._t=setTimeout(()=>{const v=document.getElementById("af-search");const pos=v?v.selectionStart:-1;render();const nv=document.getElementById("af-search");if(nv&&pos>=0){nv.focus();try{nv.setSelectionRange(pos,pos);}catch(e){}}},400);
    };
  });
  b("vf-local",el=>el.onchange=e=>{venForm.local=e.target.value;render()});
  b("vf-filter-fecha",el=>el.onchange=e=>{venFil.fecha=e.target.value;render()});
  b("res-ini",el=>el.onchange=e=>{resFil.inicio=e.target.value;render()});
  b("res-fin",el=>el.onchange=e=>{resFil.fin=e.target.value;render()});
}
</script>
</body>
